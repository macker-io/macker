services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:18081:80"
    networks:
      appnet:
        aliases: [frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 2s
  client:
    image: alpine:3.20
    command: ["sleep", "3600"]
    depends_on:
      web:
        condition: service_healthy
    networks: [appnet]
    volumes:
      - data:/data
      - ./cfg:/cfg:ro
    stop_signal: SIGKILL
networks:
  appnet:
    driver: bridge
volumes:
  data:
