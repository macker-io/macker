name: Buildx Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildx:
    # A trusted Apple Silicon runner with Virtualization.framework support and the
    # official Docker CLI / Buildx plugin installed. Do not run PR code here.
    runs-on: [self-hosted, macOS, ARM64, macker-vm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare daemon and runtime
        run: |
          test "$(sysctl -n kern.hv_support)" = 1
          docker buildx version
          make app fetch-runtime
      - name: Buildx compatibility
        shell: bash
        run: |
          store="$(mktemp -d /tmp/macker-bx-ci.XXXXXX)"
          trap 'rm -rf "$store"' EXIT
          COMPAT_STORE="$store" scripts/compat/run.sh buildx
